<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - The Gadget Hub Store</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stylesheets - FIXED PATHS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    
    <style>
        .admin-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
        }
        
        .admin-sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 2rem 0;
        }
        
        .admin-logo {
            padding: 0 2rem 2rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }
        
        .admin-nav {
            display: flex;
            flex-direction: column;
        }
        
        .admin-nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 2rem;
            color: var(--text-secondary);
            transition: all var(--transition-fast);
            cursor: pointer;
            text-decoration: none;
        }
        
        .admin-nav-item:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        
        .admin-nav-item.active {
            background: var(--accent-gradient);
            color: white;
        }
        
        .admin-main {
            padding: 2rem;
            background: var(--bg-primary);
        }
        
        .admin-header {
            margin-bottom: 2rem;
        }
        
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .admin-stat-card {
            padding: 2rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
        }
        
        .admin-stat-card h3 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--accent-primary);
        }
        
        .admin-content-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .admin-product-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            margin-bottom: 0.75rem;
        }
        
        .admin-product-item img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: var(--radius-sm);
        }
        
        .product-info {
            flex: 1;
        }
        
        .product-info h4 {
            margin-bottom: 0.25rem;
            font-size: 0.9375rem;
        }
        
        .product-info p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin: 0;
        }
        
        .product-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .btn-icon:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
            border-color: var(--accent-primary);
        }
        
        @media (max-width: 991px) {
            .admin-container {
                grid-template-columns: 1fr;
            }
            
            .admin-sidebar {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <h2>Admin Panel</h2>
            </div>
            <nav class="admin-nav">
                <!-- FIXED PATHS - Using relative paths -->
                <a href="index.html" class="admin-nav-item active">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="products.html" class="admin-nav-item">
                    <i class="fas fa-box"></i>
                    <span>Products</span>
                </a>
                <a href="categories.html" class="admin-nav-item">
                    <i class="fas fa-th"></i>
                    <span>Categories</span>
                </a>
                <a href="settings.html" class="admin-nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
                <a href="../index.html" class="admin-nav-item">
                    <i class="fas fa-home"></i>
                    <span>View Website</span>
                </a>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="admin-main">
            <div class="admin-header">
                <h1>Dashboard</h1>
                <p>Overview of your store performance</p>
            </div>
            
            <!-- Stats -->
            <div class="admin-stats">
                <div class="admin-stat-card">
                    <h3 id="totalProducts">0</h3>
                    <p>Total Products</p>
                </div>
                <div class="admin-stat-card">
                    <h3 id="totalCategories">0</h3>
                    <p>Categories</p>
                </div>
                <div class="admin-stat-card">
                    <h3 id="activeProducts">0</h3>
                    <p>Active Products</p>
                </div>
                <div class="admin-stat-card">
                    <h3 id="totalSubscribers">0</h3>
                    <p>Newsletter Subscribers</p>
                </div>
            </div>
            
            <!-- Recent Products -->
            <div class="admin-content-card">
                <h2>Recent Products</h2>
                <div id="recentProductsList">
                    <p style="color: var(--text-secondary);">Loading products...</p>
                </div>
            </div>
            
            <!-- Quick Actions -->
            <div class="admin-content-card">
                <h2>Quick Actions</h2>
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <button class="btn btn-primary" onclick="showAddProductForm()">
                        <i class="fas fa-plus"></i>
                        <span>Add Product</span>
                    </button>
                    <a href="categories.html" class="btn btn-secondary">
                        <i class="fas fa-th"></i>
                        <span>Manage Categories</span>
                    </a>
                    <a href="settings.html" class="btn btn-outline">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </a>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <!-- Application Scripts - PROPER ORDER (Firebase loaded first) -->
    <script src="../js/firebase.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/admin.js"></script>
    
    <script>
        // Initialize admin dashboard without loading overlay
        async function initAdminDashboardSafe() {
            try {
                console.log('Initializing admin dashboard...');
                
                // Load admin stats
                await loadAdminStatsSafe();
                
                // Load recent products
                await loadRecentProductsSafe();
                
                console.log('Admin dashboard initialized successfully');
            } catch (error) {
                console.error('Error initializing admin dashboard:', error);
                showToast('Error loading dashboard data', 'error');
            }
        }
        
        // Load admin statistics safely
        async function loadAdminStatsSafe() {
            try {
                const products = await getProducts();
                const categories = await getCategories();
                
                // Update stat cards
                document.getElementById('totalProducts').textContent = products.length || 0;
                document.getElementById('totalCategories').textContent = categories.length || 0;
                
                const activeProducts = products.filter(p => p.stockStatus === 'in-stock').length;
                document.getElementById('activeProducts').textContent = activeProducts || 0;
                
                // Get newsletter subscribers count
                if (isFirebaseConfigured) {
                    const subscribersSnapshot = await db.collection('newsletterSubscribers').get();
                    document.getElementById('totalSubscribers').textContent = subscribersSnapshot.size || 0;
                } else {
                    document.getElementById('totalSubscribers').textContent = '0';
                }
            } catch (error) {
                console.error('Error loading admin stats:', error);
                // Set default values on error
                document.getElementById('totalProducts').textContent = '0';
                document.getElementById('totalCategories').textContent = '0';
                document.getElementById('activeProducts').textContent = '0';
                document.getElementById('totalSubscribers').textContent = '0';
            }
        }
        
        // Load recent products safely
        async function loadRecentProductsSafe() {
            const container = document.getElementById('recentProductsList');
            if (!container) return;
            
            try {
                const products = await getProducts(10);
                
                if (products.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-secondary);">No products found. Add your first product to get started.</p>';
                    return;
                }
                
                container.innerHTML = products.map(product => `
                    <div class="admin-product-item">
                        <img src="${product.thumbnail || product.images[0] || '../assets/images/placeholder.jpg'}" 
                             alt="${product.title}"
                             onerror="this.src='../assets/images/placeholder.jpg'">
                        <div class="product-info">
                            <h4>${product.title}</h4>
                            <p>${formatPrice(product.price)}</p>
                        </div>
                        <div class="product-actions">
                            <button class="btn-icon" onclick="editProduct('${product.id}')" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn-icon" onclick="deleteProductConfirm('${product.id}')" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading recent products:', error);
                container.innerHTML = '<p style="color: var(--text-secondary);">Unable to load products. Please check your connection.</p>';
            }
        }
        
        // Edit product function
        function editProduct(productId) {
            window.location.href = `products.html?edit=${productId}`;
        }
        
        // Delete product confirmation
        function deleteProductConfirm(productId) {
            if (confirm('Are you sure you want to delete this product?')) {
                deleteProductAction(productId);
            }
        }
        
        // Delete product action
        async function deleteProductAction(productId) {
            try {
                const result = await deleteProduct(productId);
                
                if (result.success) {
                    showToast('Product deleted successfully', 'success');
                    await loadRecentProductsSafe();
                    await loadAdminStatsSafe();
                } else {
                    showToast(result.message || 'Failed to delete product', 'error');
                }
            } catch (error) {
                console.error('Error deleting product:', error);
                showToast('Failed to delete product', 'error');
            }
        }
        
        // Show add product form
        function showAddProductForm() {
            window.location.href = 'products.html';
        }
        
        // Initialize dashboard when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initAdminDashboardSafe);
        } else {
            initAdminDashboardSafe();
        }
    </script>
</body>
</html>
