<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage Categories - The Gadget Hub Store Admin">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    
    <title>Manage Categories - Admin - The Gadget Hub Store</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    
    <style>
        .admin-table { width: 100%; border-collapse: collapse; margin-top: var(--spacing-lg); background: var(--color-bg-glass); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
        .admin-table th, .admin-table td { padding: var(--spacing-md); text-align: left; border-bottom: 1px solid var(--color-border); }
        .admin-table th { background: var(--color-bg-elevated); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); }
        .admin-table tr:last-child td { border-bottom: none; }
        .admin-table tbody tr:hover { background: var(--color-bg-elevated); }
        .admin-actions { display: flex; gap: var(--spacing-xs); }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--color-overlay); backdrop-filter: blur(var(--blur-sm)); display: none; align-items: center; justify-content: center; z-index: var(--z-modal); }
        .modal.active { display: flex; }
        .modal-content { background: var(--color-bg-glass); backdrop-filter: blur(var(--blur-lg)); border: 1px solid var(--color-border); border-radius: var(--radius-xl); max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; padding: var(--spacing-xl); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg); }
        .modal-close { background: none; border: none; color: var(--color-text-tertiary); cursor: pointer; padding: var(--spacing-xs); font-size: 1.5rem; }
        .form-group { margin-bottom: var(--spacing-md); }
        .form-label { display: block; margin-bottom: var(--spacing-xs); font-weight: var(--font-weight-medium); color: var(--color-text-primary); }
        .form-input, .form-textarea { width: 100%; padding: var(--spacing-sm); background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-md); color: var(--color-text-primary); font-family: var(--font-family); font-size: 0.9375rem; }
        .form-textarea { min-height: 80px; resize: vertical; }
        .category-image-preview { width: 100px; height: 100px; object-fit: cover; border-radius: var(--radius-md); margin-top: var(--spacing-sm); }
    </style>
</head>
<body>
    
    <nav class="nav" id="mainNav">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="../index.html" class="logo">THE GADGET HUB STORE ADMIN</a>
            </div>
            
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Dashboard</a></li>
                <li><a href="products.html" class="nav-link">Products</a></li>
                <li><a href="categories.html" class="nav-link active" aria-current="page">Categories</a></li>
                <li><a href="settings.html" class="nav-link">Settings</a></li>
            </ul>
            
            <div class="nav-actions">
                <a href="../index.html" class="nav-icon-btn" aria-label="View Store">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    </svg>
                </a>
                
                <button class="nav-icon-btn theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </div>
    </nav>
    
    <main class="container" style="padding-top: var(--spacing-2xl); padding-bottom: var(--spacing-3xl);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-xl);">
            <h1>Manage Categories</h1>
            <button class="btn btn-primary" id="addCategoryBtn">Add Category</button>
        </div>
        
        <div id="categoriesTableContainer">
            <div class="products-loading"><div class="spinner"></div><p>Loading categories...</p></div>
        </div>
    </main>
    
    <div class="modal" id="categoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Category</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <form id="categoryForm">
                <input type="hidden" id="categoryId">
                <div class="form-group">
                    <label class="form-label">Name *</label>
                    <input type="text" class="form-input" id="categoryName" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Slug *</label>
                    <input type="text" class="form-input" id="categorySlug" required placeholder="e.g., smart-gadgets">
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea class="form-textarea" id="categoryDescription"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Icon Name</label>
                    <input type="text" class="form-input" id="categoryIcon" placeholder="e.g., smart-gadgets">
                    <small style="color: var(--color-text-muted); font-size: 0.8125rem;">Used for default icon if no image provided</small>
                </div>
                <div class="form-group">
                    <label class="form-label">Image URL</label>
                    <input type="url" class="form-input" id="categoryImage">
                    <img id="imagePreview" class="category-image-preview" style="display: none;">
                </div>
                <div class="form-group">
                    <label class="form-label">Order</label>
                    <input type="number" class="form-input" id="categoryOrder" min="0" placeholder="Display order (optional)">
                </div>
                <div style="display: flex; gap: var(--spacing-md); justify-content: flex-end; margin-top: var(--spacing-xl);">
                    <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveCategoryBtn">
                        <span class="btn-text">Save Category</span>
                        <span class="btn-loading"><span class="spinner-small"></span></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>
    
    <script type="module" src="../js/firebase.js"></script>
    <script type="module" src="../js/ui.js"></script>
    <script type="module">
        import { loadAdminCategories, createCategory, updateCategory, deleteCategory } from '../js/admin.js';
        import { showToast, setButtonLoading, escapeHtml } from '../js/ui.js';
        
        let categories = [];
        let editingCategoryId = null;
        
        async function init() {
            await loadCategories();
            setupEventListeners();
        }
        
        async function loadCategories() {
            try {
                categories = await loadAdminCategories();
                renderCategoriesTable();
            } catch (error) {
                console.error('Error loading categories:', error);
                document.getElementById('categoriesTableContainer').innerHTML = '<p style="color: var(--color-error);">Failed to load categories</p>';
            }
        }
        
        function renderCategoriesTable() {
            const container = document.getElementById('categoriesTableContainer');
            if (categories.length === 0) {
                container.innerHTML = '<p style="text-align: center; padding: var(--spacing-2xl); color: var(--color-text-tertiary);">No categories yet. Add your first category!</p>';
                return;
            }
            
            container.innerHTML = `
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Slug</th>
                            <th>Description</th>
                            <th>Order</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${categories.map(c => `
                            <tr>
                                <td>${escapeHtml(c.name || 'Untitled')}</td>
                                <td>${escapeHtml(c.slug || 'N/A')}</td>
                                <td>${escapeHtml((c.description || '').substring(0, 50))}${(c.description || '').length > 50 ? '...' : ''}</td>
                                <td>${c.order !== undefined ? c.order : '–'}</td>
                                <td class="admin-actions">
                                    <button class="btn btn-outline btn-sm" onclick="window.editCategory('${c.id}')">Edit</button>
                                    <button class="btn btn-outline btn-sm" onclick="window.deleteCategoryConfirm('${c.id}')">Delete</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        function setupEventListeners() {
            document.getElementById('addCategoryBtn').addEventListener('click', openAddModal);
            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('cancelBtn').addEventListener('click', closeModal);
            document.getElementById('categoryForm').addEventListener('submit', handleSubmit);
            
            document.getElementById('categoryName').addEventListener('input', (e) => {
                if (!editingCategoryId) {
                    const slug = e.target.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
                    document.getElementById('categorySlug').value = slug;
                }
            });
            
            document.getElementById('categoryImage').addEventListener('input', (e) => {
                const preview = document.getElementById('imagePreview');
                if (e.target.value) {
                    preview.src = e.target.value;
                    preview.style.display = 'block';
                    preview.onerror = () => { preview.style.display = 'none'; };
                } else {
                    preview.style.display = 'none';
                }
            });
        }
        
        function openAddModal() {
            editingCategoryId = null;
            document.getElementById('modalTitle').textContent = 'Add Category';
            document.getElementById('categoryForm').reset();
            document.getElementById('categoryId').value = '';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('categoryModal').classList.add('active');
        }
        
        window.editCategory = function(categoryId) {
            const category = categories.find(c => c.id === categoryId);
            if (!category) return;
            
            editingCategoryId = categoryId;
            document.getElementById('modalTitle').textContent = 'Edit Category';
            document.getElementById('categoryId').value = categoryId;
            document.getElementById('categoryName').value = category.name || '';
            document.getElementById('categorySlug').value = category.slug || '';
            document.getElementById('categoryDescription').value = category.description || '';
            document.getElementById('categoryIcon').value = category.icon || '';
            document.getElementById('categoryImage').value = category.image || '';
            document.getElementById('categoryOrder').value = category.order !== undefined ? category.order : '';
            
            const preview = document.getElementById('imagePreview');
            if (category.image) {
                preview.src = category.image;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }
            
            document.getElementById('categoryModal').classList.add('active');
        };
        
        window.deleteCategoryConfirm = async function(categoryId) {
            if (!confirm('Are you sure you want to delete this category? This will not delete products in this category.')) return;
            
            try {
                await deleteCategory(categoryId);
                showToast('Category deleted successfully', 'success');
                await loadCategories();
            } catch (error) {
                showToast('Failed to delete category', 'error');
            }
        };
        
        function closeModal() {
            document.getElementById('categoryModal').classList.remove('active');
        }
        
        async function handleSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('saveCategoryBtn');
            setButtonLoading(btn, true);
            
            const categoryData = {
                name: document.getElementById('categoryName').value.trim(),
                slug: document.getElementById('categorySlug').value.trim(),
                description: document.getElementById('categoryDescription').value.trim(),
                icon: document.getElementById('categoryIcon').value.trim(),
                image: document.getElementById('categoryImage').value.trim(),
                order: parseInt(document.getElementById('categoryOrder').value) || 0
            };
            
            if (!categoryData.name || !categoryData.slug) {
                showToast('Name and slug are required', 'error');
                setButtonLoading(btn, false);
                return;
            }
            
            try {
                if (editingCategoryId) {
                    await updateCategory(editingCategoryId, categoryData);
                    showToast('Category updated successfully', 'success');
                } else {
                    await createCategory(categoryData);
                    showToast('Category created successfully', 'success');
                }
                closeModal();
                await loadCategories();
            } catch (error) {
                showToast('Failed to save category', 'error');
            } finally {
                setButtonLoading(btn, false);
            }
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
