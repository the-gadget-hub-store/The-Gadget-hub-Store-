<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Categories - Admin - The Gadget Hub Store</title>
  
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/animations.css">
  
  <style>
    .admin-layout {
      display: flex;
      min-height: 100vh;
      background: var(--bg-primary);
    }
    
    .admin-sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 1000;
      transition: transform var(--transition-base);
    }
    
    .admin-sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    
    .admin-nav {
      padding: 1rem;
    }
    
    .admin-nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem 1rem;
      color: var(--text-secondary);
      border-radius: var(--radius-md);
      margin-bottom: 0.25rem;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-decoration: none;
    }
    
    .admin-nav-item:hover,
    .admin-nav-item.active {
      background: var(--surface-hover);
      color: var(--text-primary);
    }
    
    .admin-nav-item.active {
      background: var(--accent-gradient);
      color: white;
    }
    
    .admin-main {
      flex: 1;
      margin-left: 260px;
      padding: 2rem;
    }
    
    .admin-header {
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    
    .category-admin-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2rem;
      text-align: center;
      transition: all var(--transition-fast);
    }
    
    .category-admin-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
    }
    
    .category-admin-icon {
      width: 80px;
      height: 80px;
      background: var(--accent-gradient);
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 1rem;
    }
    
    .category-admin-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1.5rem;
      justify-content: center;
    }
    
    .admin-sidebar-toggle {
      display: none;
      width: 40px;
      height: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 1100;
    }
    
    .admin-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
    }
    
    .admin-overlay.active {
      display: block;
    }
    
    @media (max-width: 1024px) {
      .admin-sidebar {
        transform: translateX(-100%);
      }
      
      .admin-sidebar.active {
        transform: translateX(0);
      }
      
      .admin-main {
        margin-left: 0;
      }
      
      .admin-sidebar-toggle {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar Toggle (Mobile) -->
    <button class="admin-sidebar-toggle">☰</button>
    
    <!-- Overlay -->
    <div class="admin-overlay"></div>
    
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <a href="/index.html" class="logo">The Gadget Hub Store</a>
        <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.5rem;">Admin Panel</p>
      </div>
      
      <nav class="admin-nav">
        <a href="/admin/index.html" class="admin-nav-item">
          <span>📊</span>
          <span>Dashboard</span>
        </a>
        
        <a href="/admin/products.html" class="admin-nav-item">
          <span>📦</span>
          <span>Products</span>
        </a>
        
        <a href="/admin/categories.html" class="admin-nav-item active">
          <span>📂</span>
          <span>Categories</span>
        </a>
        
        <a href="/admin/settings.html" class="admin-nav-item">
          <span>⚙️</span>
          <span>Settings</span>
        </a>
        
        <div style="height: 1px; background: var(--border); margin: 1rem 0;"></div>
        
        <a href="/index.html" class="admin-nav-item">
          <span>🏠</span>
          <span>View Website</span>
        </a>
        
        <a href="/account.html" class="admin-nav-item sign-out-btn">
          <span>🚪</span>
          <span>Sign Out</span>
        </a>
      </nav>
    </aside>
    
    <!-- Main Content -->
    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1>Categories</h1>
          <p style="color: var(--text-secondary); margin-top: 0.5rem;">
            Organize your product collection
          </p>
        </div>
        
        <div style="display: flex; gap: 1rem; align-items: center;">
          <button class="theme-toggle" aria-label="Toggle theme">
            <div class="theme-toggle-slider">🌙</div>
          </button>
          
          <button class="btn btn-primary" onclick="showCategoryModal()">
            ➕ Add Category
          </button>
        </div>
      </div>
      
      <!-- Categories Grid -->
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;" id="categories-grid">
        <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-muted);">
          Loading categories...
        </div>
      </div>
    </main>
  </div>
  
  <!-- Category Modal -->
  <div class="modal-overlay" id="category-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="category-modal-title">Add Category</h3>
        <div class="modal-close" onclick="closeCategoryModal()">✕</div>
      </div>
      
      <form class="modal-body" id="category-form">
        <input type="hidden" name="category-id" id="category-id" />
        
        <div class="form-group">
          <label class="form-label">Category Name *</label>
          <input type="text" class="form-input" name="name" required />
        </div>
        
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-textarea" name="description" rows="3"></textarea>
        </div>
        
        <div class="form-group">
          <label class="form-label">Icon (Emoji)</label>
          <input type="text" class="form-input" name="icon" placeholder="📦" maxlength="2" />
          <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">
            Use an emoji to represent this category
          </small>
        </div>
        
        <div class="modal-footer" style="margin-top: 2rem;">
          <button type="button" class="btn btn-outline" onclick="closeCategoryModal()">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary">
            Save Category
          </button>
        </div>
      </form>
    </div>
  </div>
  
  <!-- Scripts -->
  <script type="module">
    import { initializeFirebase } from '/js/firebase-init.js';
    import { initAuth } from '/js/auth.js';
    import { initTheme } from '/js/theme.js';
    import { initAdminDashboard } from '/js/admin.js';
    import { initCategoriesListener } from '/js/categories.js';
    
    // Initialize
    async function init() {
      await initializeFirebase();
      initTheme();
      await initAuth();
      await initCategoriesListener();
      await initAdminDashboard();
      
      setupSidebar();
    }
    
    // Setup sidebar
    function setupSidebar() {
      const toggle = document.querySelector('.admin-sidebar-toggle');
      const sidebar = document.querySelector('.admin-sidebar');
      const overlay = document.querySelector('.admin-overlay');
      
      toggle?.addEventListener('click', () => {
        sidebar?.classList.add('active');
        overlay?.classList.add('active');
      });
      
      overlay?.addEventListener('click', () => {
        sidebar?.classList.remove('active');
        overlay?.classList.remove('active');
      });
    }
    
    init();
  </script>
</body>
</html>
