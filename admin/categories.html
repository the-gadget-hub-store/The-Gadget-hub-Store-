<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories Management - Admin - The Gadget Hub Store</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/responsive.css">
    
    <!-- Reuse styles from products.html -->
    <link rel="stylesheet" href="/admin/products.html" media="none" onload="if(media!='all')media='all'">
    
    <style>
        /* Include all styles from products.html */
        .admin-container { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
        .admin-sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 2rem 0; position: fixed; height: 100vh; width: 250px; overflow-y: auto; }
        .admin-logo { padding: 0 2rem 2rem; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
        .admin-logo h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem; }
        .admin-logo i { color: var(--accent-primary); }
        .admin-nav { display: flex; flex-direction: column; }
        .admin-nav-item { display: flex; align-items: center; gap: 1rem; padding: 1rem 2rem; color: var(--text-secondary); transition: all var(--transition-fast); cursor: pointer; text-decoration: none; }
        .admin-nav-item:hover { background: var(--bg-secondary); color: var(--text-primary); }
        .admin-nav-item.active { background: var(--accent-gradient); color: white; }
        .admin-nav-item i { width: 20px; text-align: center; }
        .admin-main { margin-left: 250px; padding: 2rem; background: var(--bg-primary); min-height: 100vh; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
        .admin-header-title h1 { margin-bottom: 0.5rem; }
        .admin-header-title p { color: var(--text-secondary); margin: 0; }
        .admin-actions { display: flex; gap: 1rem; flex-wrap: wrap; }
        .admin-content-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2rem; margin-bottom: 2rem; }
        
        .categories-grid-admin {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        
        .category-card-admin {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            transition: all var(--transition-base);
            position: relative;
        }
        
        .category-card-admin:hover {
            border-color: var(--accent-primary);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        
        .category-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }
        
        .category-icon-display {
            width: 60px;
            height: 60px;
            background: var(--accent-gradient);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            color: white;
        }
        
        .category-card-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-secondary); cursor: pointer; transition: all var(--transition-fast); }
        .btn-icon:hover { background: var(--surface-hover); color: var(--text-primary); border-color: var(--accent-primary); }
        .btn-icon.btn-danger:hover { background: var(--danger); border-color: var(--danger); color: white; }
        
        .category-card-body h3 {
            margin-bottom: 0.5rem;
            font-size: 1.25rem;
        }
        
        .category-description {
            color: var(--text-secondary);
            font-size: 0.9375rem;
            margin-bottom: 1rem;
        }
        
        .category-stats {
            display: flex;
            gap: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        
        .category-stat {
            display: flex;
            flex-direction: column;
        }
        
        .category-stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-primary);
        }
        
        .category-stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .category-featured-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.375rem 0.75rem;
            background: var(--accent-gradient);
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: var(--radius-full);
        }
        
        .custom-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: var(--z-modal); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity var(--transition-base); }
        .custom-modal.active { opacity: 1; pointer-events: all; }
        .custom-modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); }
        .custom-modal-content { position: relative; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); transform: scale(0.9); transition: transform var(--transition-base); }
        .custom-modal.active .custom-modal-content { transform: scale(1); }
        .custom-modal-header { display: flex; justify-content: space-between; align-items: center; padding: 2rem; border-bottom: 1px solid var(--border); }
        .custom-modal-header h3 { margin: 0; font-size: 1.5rem; }
        .custom-modal-close { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: var(--bg-secondary); border: none; border-radius: var(--radius-md); color: var(--text-secondary); cursor: pointer; transition: all var(--transition-fast); }
        .custom-modal-close:hover { background: var(--surface-hover); color: var(--text-primary); transform: rotate(90deg); }
        .custom-modal-body { padding: 2rem; }
        .custom-modal-footer { padding: 1.5rem 2rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 1rem; }
        
        .admin-form { display: grid; gap: 1.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-group label { font-weight: 600; font-size: 0.9375rem; }
        .form-group input, .form-group textarea, .form-group select { padding: 0.75rem 1rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary); font-family: inherit; font-size: 0.9375rem; transition: all var(--transition-fast); }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--accent-primary); background: var(--surface); }
        .form-actions { display: flex; gap: 1rem; justify-content: flex-end; padding-top: 1rem; border-top: 1px solid var(--border); }
        
        .icon-picker {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            gap: 0.5rem;
            max-height: 300px;
            overflow-y: auto;
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            margin-top: 0.5rem;
        }
        
        .icon-option {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-size: 1.5rem;
        }
        
        .icon-option:hover {
            border-color: var(--accent-primary);
            transform: scale(1.1);
        }
        
        .icon-option.selected {
            background: var(--accent-gradient);
            border-color: transparent;
            color: white;
        }
        
        .empty-state-admin { text-align: center; padding: 4rem 2rem; }
        .empty-state-admin i { font-size: 4rem; color: var(--text-muted); margin-bottom: 1.5rem; }
        .empty-state-admin h3 { margin-bottom: 1rem; }
        .empty-state-admin p { color: var(--text-secondary); max-width: 400px; margin: 0 auto 2rem; }
        
        @media (max-width: 991px) {
            .admin-container { grid-template-columns: 1fr; }
            .admin-sidebar { position: static; width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
            .admin-main { margin-left: 0; }
            .categories-grid-admin { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <h2>
                    <i class="fas fa-shield-alt"></i>
                    Admin Panel
                </h2>
            </div>
            <nav class="admin-nav">
                <a href="/admin/index.html" class="admin-nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/admin/products.html" class="admin-nav-item">
                    <i class="fas fa-box"></i>
                    <span>Products</span>
                </a>
                <a href="/admin/categories.html" class="admin-nav-item active">
                    <i class="fas fa-th"></i>
                    <span>Categories</span>
                </a>
                <a href="/admin/settings.html" class="admin-nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
                <a href="/" class="admin-nav-item">
                    <i class="fas fa-home"></i>
                    <span>View Website</span>
                </a>
                <div class="admin-nav-item" onclick="signOut()" style="margin-top: auto; border-top: 1px solid var(--border);">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Sign Out</span>
                </div>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="admin-main">
            <div class="admin-header">
                <div class="admin-header-title">
                    <h1>Categories Management</h1>
                    <p>Organize your products into categories</p>
                </div>
                <div class="admin-actions">
                    <button class="btn btn-primary" onclick="showAddCategoryModal()">
                        <i class="fas fa-plus"></i>
                        <span>Add New Category</span>
                    </button>
                </div>
            </div>
            
            <!-- Categories Grid -->
            <div class="admin-content-card">
                <div class="categories-grid-admin" id="categoriesGrid">
                    <!-- Categories loaded here -->
                    <div style="grid-column: 1/-1; text-align: center; padding: 3rem;">
                        <div class="loading-spinner"></div>
                        <p style="margin-top: 1rem; color: var(--text-secondary);">Loading categories...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>
    
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader">
            <div class="loader-cube"></div>
            <div class="loader-cube"></div>
            <div class="loader-cube"></div>
            <div class="loader-cube"></div>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <!-- Application Scripts -->
    <script src="/js/firebase.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/categories.js"></script>
    <script src="/js/admin.js"></script>
    
    <script>
        let allCategories = [];
        
        // Popular Font Awesome icons for categories
        const popularIcons = [
            'fa-lightbulb', 'fa-mobile-alt', 'fa-gamepad', 'fa-home', 'fa-headphones',
            'fa-watch', 'fa-keyboard', 'fa-car', 'fa-camera', 'fa-laptop',
            'fa-tv', 'fa-tablet-alt', 'fa-microphone', 'fa-music', 'fa-video',
            'fa-plug', 'fa-battery-full', 'fa-wifi', 'fa-bluetooth', 'fa-usb',
            'fa-hdd', 'fa-mouse', 'fa-print', 'fa-robot', 'fa-vr-cardboard',
            'fa-desktop', 'fa-shopping-cart', 'fa-tools', 'fa-wrench', 'fa-dumbbell'
        ];
        
        // Initialize page
        async function initCategoriesPage() {
            const hasAccess = await checkAdminAccess();
            if (!hasAccess) return;
            
            await loadAllCategories();
        }
        
        // Load all categories
        async function loadAllCategories() {
            try {
                showLoading();
                allCategories = await getCategories();
                displayCategories();
                hideLoading();
            } catch (error) {
                console.error('Error loading categories:', error);
                showToast('Failed to load categories', 'error');
                hideLoading();
            }
        }
        
        // Display categories
        function displayCategories() {
            const container = document.getElementById('categoriesGrid');
            
            if (allCategories.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1;">
                        <div class="empty-state-admin">
                            <i class="fas fa-th"></i>
                            <h3>No Categories Found</h3>
                            <p>Start by creating your first product category.</p>
                            <button class="btn btn-primary" onclick="showAddCategoryModal()">
                                <i class="fas fa-plus"></i>
                                <span>Add Category</span>
                            </button>
                        </div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = allCategories.map(category => `
                <div class="category-card-admin">
                    ${category.featured ? '<div class="category-featured-badge">Featured</div>' : ''}
                    
                    <div class="category-card-header">
                        <div class="category-icon-display">
                            <i class="fas ${category.icon}"></i>
                        </div>
                        <div class="category-card-actions">
                            <button class="btn-icon" onclick="editCategoryModal('${category.id}')" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn-icon btn-danger" onclick="deleteCategoryConfirm('${category.id}')" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="category-card-body">
                        <h3>${category.name}</h3>
                        <p class="category-description">${category.description || 'No description'}</p>
                        
                        <div class="category-stats">
                            <div class="category-stat">
                                <div class="category-stat-value">${formatNumber(category.productCount || 0)}</div>
                                <div class="category-stat-label">Products</div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // Show add category modal
        function showAddCategoryModal() {
            const formHTML = `
                <form id="addCategoryForm" class="admin-form">
                    <div class="form-group">
                        <label for="categoryName">Category Name *</label>
                        <input type="text" id="categoryName" required placeholder="Enter category name">
                    </div>
                    
                    <div class="form-group">
                        <label for="categoryDescription">Description</label>
                        <textarea id="categoryDescription" rows="3" placeholder="Enter category description"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="categorySlug">Slug *</label>
                        <input type="text" id="categorySlug" required placeholder="category-slug">
                        <small style="color: var(--text-muted);">URL-friendly name (lowercase, no spaces)</small>
                    </div>
                    
                    <div class="form-group">
                        <label>Icon *</label>
                        <input type="hidden" id="selectedIcon" required>
                        <div class="icon-picker" id="iconPicker">
                            ${popularIcons.map(icon => `
                                <div class="icon-option" data-icon="${icon}" onclick="selectIcon('${icon}')">
                                    <i class="fas ${icon}"></i>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="categoryFeatured" style="width: auto; margin-right: 0.5rem;">
                            <span>Featured Category</span>
                        </label>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" onclick="closeModal()" class="btn btn-outline">Cancel</button>
                        <button type="submit" class="btn btn-primary">Add Category</button>
                    </div>
                </form>
            `;
            
            createModal('Add New Category', formHTML);
            
            // Auto-generate slug from name
            document.getElementById('categoryName').addEventListener('input', (e) => {
                const slug = e.target.value.toLowerCase()
                    .replace(/[^\w\s-]/g, '')
                    .replace(/\s+/g, '-');
                document.getElementById('categorySlug').value = slug;
            });
            
            // Handle form submission
            document.getElementById('addCategoryForm').addEventListener('submit', handleAddCategory);
        }
        
        // Select icon
        function selectIcon(icon) {
            document.querySelectorAll('.icon-option').forEach(opt => opt.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            document.getElementById('selectedIcon').value = icon;
        }
        
        // Handle add category
        async function handleAddCategory(e) {
            e.preventDefault();
            
            const icon = document.getElementById('selectedIcon').value;
            if (!icon) {
                showToast('Please select an icon', 'error');
                return;
            }
            
            const categoryData = {
                name: document.getElementById('categoryName').value,
                description: document.getElementById('categoryDescription').value,
                slug: document.getElementById('categorySlug').value,
                icon: icon,
                featured: document.getElementById('categoryFeatured').checked,
                productCount: 0
            };
            
            try {
                showLoading();
                
                if (isFirebaseConfigured) {
                    await db.collection('categories').add({
                        ...categoryData,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    showToast('Category added successfully!', 'success');
                    closeModal();
                    await loadAllCategories();
                } else {
                    showToast('Firebase not configured', 'error');
                }
                
                hideLoading();
            } catch (error) {
                console.error('Error adding category:', error);
                showToast('Failed to add category', 'error');
                hideLoading();
            }
        }
        
        // Edit category modal
        function editCategoryModal(categoryId) {
            const category = allCategories.find(c => c.id === categoryId);
            if (!category) return;
            
            const formHTML = `
                <form id="editCategoryForm" class="admin-form">
                    <input type="hidden" id="editCategoryId" value="${categoryId}">
                    
                    <div class="form-group">
                        <label for="editCategoryName">Category Name *</label>
                        <input type="text" id="editCategoryName" required value="${category.name}">
                    </div>
                    
                    <div class="form-group">
                        <label for="editCategoryDescription">Description</label>
                        <textarea id="editCategoryDescription" rows="3">${category.description || ''}</textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="editCategorySlug">Slug *</label>
                        <input type="text" id="editCategorySlug" required value="${category.slug}">
                    </div>
                    
                    <div class="form-group">
                        <label>Icon *</label>
                        <input type="hidden" id="editSelectedIcon" value="${category.icon}" required>
                        <div class="icon-picker" id="editIconPicker">
                            ${popularIcons.map(icon => `
                                <div class="icon-option ${icon === category.icon ? 'selected' : ''}" 
                                     data-icon="${icon}" 
                                     onclick="selectEditIcon('${icon}')">
                                    <i class="fas ${icon}"></i>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="editCategoryFeatured" ${category.featured ? 'checked' : ''} style="width: auto; margin-right: 0.5rem;">
                            <span>Featured Category</span>
                        </label>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" onclick="closeModal()" class="btn btn-outline">Cancel</button>
                        <button type="submit" class="btn btn-primary">Update Category</button>
                    </div>
                </form>
            `;
            
            createModal('Edit Category', formHTML);
            
            // Handle form submission
            document.getElementById('editCategoryForm').addEventListener('submit', handleEditCategory);
        }
        
        // Select edit icon
        function selectEditIcon(icon) {
            document.querySelectorAll('#editIconPicker .icon-option').forEach(opt => opt.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            document.getElementById('editSelectedIcon').value = icon;
        }
        
        // Handle edit category
        async function handleEditCategory(e) {
            e.preventDefault();
            
            const categoryId = document.getElementById('editCategoryId').value;
            
            const categoryData = {
                name: document.getElementById('editCategoryName').value,
                description: document.getElementById('editCategoryDescription').value,
                slug: document.getElementById('editCategorySlug').value,
                icon: document.getElementById('editSelectedIcon').value,
                featured: document.getElementById('editCategoryFeatured').checked
            };
            
            try {
                showLoading();
                
                if (isFirebaseConfigured) {
                    await db.collection('categories').doc(categoryId).update({
                        ...categoryData,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    showToast('Category updated successfully!', 'success');
                    closeModal();
                    await loadAllCategories();
                } else {
                    showToast('Firebase not configured', 'error');
                }
                
                hideLoading();
            } catch (error) {
                console.error('Error updating category:', error);
                showToast('Failed to update category', 'error');
                hideLoading();
            }
        }
        
        // Delete category confirmation
        function deleteCategoryConfirm(categoryId) {
            const category = allCategories.find(c => c.id === categoryId);
            if (!category) return;
            
            createModal(
                'Confirm Delete',
                `<p>Are you sure you want to delete <strong>${category.name}</strong>?</p>
                 <p style="color: var(--warning); margin-top: 1rem;">
                     <i class="fas fa-exclamation-triangle"></i>
                     Products in this category will become uncategorized.
                 </p>`,
                {
                    footer: `
                        <button onclick="closeModal()" class="btn btn-outline">Cancel</button>
                        <button onclick="performDeleteCategory('${categoryId}')" class="btn btn-primary" style="background: var(--danger); border-color: var(--danger);">
                            <i class="fas fa-trash"></i>
                            <span>Delete Category</span>
                        </button>
                    `
                }
            );
        }
        
        // Perform delete category
        async function performDeleteCategory(categoryId) {
            try {
                showLoading();
                
                if (isFirebaseConfigured) {
                    await db.collection('categories').doc(categoryId).delete();
                    showToast('Category deleted successfully', 'success');
                    closeModal();
                    await loadAllCategories();
                } else {
                    showToast('Firebase not configured', 'error');
                }
                
                hideLoading();
            } catch (error) {
                console.error('Error deleting category:', error);
                showToast('Failed to delete category', 'error');
                hideLoading();
            }
        }
        
        // Close modal
        function closeModal() {
            const modal = document.querySelector('.custom-modal');
            if (modal) {
                modal.classList.remove('active');
                setTimeout(() => modal.remove(), 300);
            }
        }
        
        // Initialize page
        initCategoriesPage();
    </script>
</body>
</html>
