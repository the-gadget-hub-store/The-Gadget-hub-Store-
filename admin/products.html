<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products - Admin - The Gadget Hub Store</title>
  
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/animations.css">
  
  <style>
    .admin-layout {
      display: flex;
      min-height: 100vh;
      background: var(--bg-primary);
    }
    
    .admin-sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 1000;
      transition: transform var(--transition-base);
    }
    
    .admin-sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    
    .admin-nav {
      padding: 1rem;
    }
    
    .admin-nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem 1rem;
      color: var(--text-secondary);
      border-radius: var(--radius-md);
      margin-bottom: 0.25rem;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-decoration: none;
    }
    
    .admin-nav-item:hover,
    .admin-nav-item.active {
      background: var(--surface-hover);
      color: var(--text-primary);
    }
    
    .admin-nav-item.active {
      background: var(--accent-gradient);
      color: white;
    }
    
    .admin-main {
      flex: 1;
      margin-left: 260px;
      padding: 2rem;
    }
    
    .admin-header {
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    
    .admin-table {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
    }
    
    .admin-table table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .admin-table th {
      background: var(--bg-secondary);
      padding: 1rem;
      text-align: left;
      font-weight: 600;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border);
    }
    
    .admin-table td {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
    }
    
    .admin-table tr:last-child td {
      border-bottom: none;
    }
    
    .admin-table tr:hover {
      background: var(--surface-hover);
    }
    
    .btn-icon {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
      font-size: 1.1rem;
    }
    
    .btn-icon:hover {
      background: var(--surface-hover);
      transform: translateY(-2px);
    }
    
    .badge {
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
    }
    
    .badge-success {
      background: var(--success);
      color: white;
    }
    
    .badge-info {
      background: var(--info);
      color: white;
    }
    
    .admin-sidebar-toggle {
      display: none;
      width: 40px;
      height: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 1100;
    }
    
    .admin-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
    }
    
    .admin-overlay.active {
      display: block;
    }
    
    @media (max-width: 1024px) {
      .admin-sidebar {
        transform: translateX(-100%);
      }
      
      .admin-sidebar.active {
        transform: translateX(0);
      }
      
      .admin-main {
        margin-left: 0;
      }
      
      .admin-sidebar-toggle {
        display: flex;
      }
      
      .admin-table {
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar Toggle (Mobile) -->
    <button class="admin-sidebar-toggle">☰</button>
    
    <!-- Overlay -->
    <div class="admin-overlay"></div>
    
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <a href="/index.html" class="logo">The Gadget Hub Store</a>
        <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.5rem;">Admin Panel</p>
      </div>
      
      <nav class="admin-nav">
        <a href="/admin/index.html" class="admin-nav-item">
          <span>📊</span>
          <span>Dashboard</span>
        </a>
        
        <a href="/admin/products.html" class="admin-nav-item active">
          <span>📦</span>
          <span>Products</span>
        </a>
        
        <a href="/admin/categories.html" class="admin-nav-item">
          <span>📂</span>
          <span>Categories</span>
        </a>
        
        <a href="/admin/settings.html" class="admin-nav-item">
          <span>⚙️</span>
          <span>Settings</span>
        </a>
        
        <div style="height: 1px; background: var(--border); margin: 1rem 0;"></div>
        
        <a href="/index.html" class="admin-nav-item">
          <span>🏠</span>
          <span>View Website</span>
        </a>
        
        <a href="/account.html" class="admin-nav-item sign-out-btn">
          <span>🚪</span>
          <span>Sign Out</span>
        </a>
      </nav>
    </aside>
    
    <!-- Main Content -->
    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1>Products</h1>
          <p style="color: var(--text-secondary); margin-top: 0.5rem;">
            Manage your product catalog
          </p>
        </div>
        
        <div style="display: flex; gap: 1rem; align-items: center;">
          <button class="theme-toggle" aria-label="Toggle theme">
            <div class="theme-toggle-slider">🌙</div>
          </button>
          
          <button class="btn btn-primary" onclick="showProductModal()">
            ➕ Add Product
          </button>
        </div>
      </div>
      
      <!-- Products Table -->
      <div class="admin-table fade-in">
        <table>
          <thead>
            <tr>
              <th>Image</th>
              <th>Title</th>
              <th>Category</th>
              <th>Price</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="products-table-body">
            <tr>
              <td colspan="6" style="text-align: center; padding: 3rem; color: var(--text-muted);">
                Loading products...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
  
  <!-- Product Modal -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal" style="max-width: 700px;">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Add Product</h3>
        <div class="modal-close" onclick="closeProductModal()">✕</div>
      </div>
      
      <form class="modal-body" id="product-form">
        <input type="hidden" name="product-id" id="product-id" />
        
        <div class="form-group">
          <label class="form-label">Product Title *</label>
          <input type="text" class="form-input" name="title" required />
        </div>
        
        <div class="form-group">
          <label class="form-label">Short Description</label>
          <input type="text" class="form-input" name="short-description" />
        </div>
        
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-textarea" name="description" rows="4"></textarea>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Price *</label>
            <input type="number" class="form-input" name="price" step="0.01" required />
          </div>
          
          <div class="form-group">
            <label class="form-label">Original Price</label>
            <input type="number" class="form-input" name="original-price" step="0.01" />
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Category *</label>
          <select class="form-select" name="category" id="product-category" required>
            <option value="">Select category</option>
          </select>
        </div>
        
        <div class="form-group">
          <label class="form-label">Affiliate URL *</label>
          <input type="url" class="form-input" name="affiliate-url" required />
        </div>
        
        <div class="form-group">
          <label class="form-label">Product Image</label>
          <input type="file" class="form-input" name="image" id="product-image" accept="image/*" />
          <img id="image-preview" style="max-width: 200px; margin-top: 1rem; display: none; border-radius: var(--radius-md);" />
        </div>
        
        <div class="form-group">
          <label class="form-label">Stock Status</label>
          <select class="form-select" name="stock-status">
            <option value="in-stock">In Stock</option>
            <option value="out-of-stock">Out of Stock</option>
          </select>
        </div>
        
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 1rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" name="featured" />
            <span>Featured</span>
          </label>
          
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" name="trending" />
            <span>Trending</span>
          </label>
          
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" name="bestseller" />
            <span>Best Seller</span>
          </label>
        </div>
        
        <div class="modal-footer" style="margin-top: 2rem;">
          <button type="button" class="btn btn-outline" onclick="closeProductModal()">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary">
            Save Product
          </button>
        </div>
      </form>
    </div>
  </div>
  
  <!-- Scripts -->
  <script type="module">
    import { initializeFirebase } from '/js/firebase-init.js';
    import { initAuth } from '/js/auth.js';
    import { initTheme } from '/js/theme.js';
    import { initAdminDashboard } from '/js/admin.js';
    import { initProductsListener } from '/js/products.js';
    import { initCategoriesListener } from '/js/categories.js';
    import { getState, subscribe } from '/js/state.js';
    
    // Initialize
    async function init() {
      await initializeFirebase();
      initTheme();
      await initAuth();
      await initProductsListener();
      await initCategoriesListener();
      await initAdminDashboard();
      
      setupSidebar();
      loadCategories();
    }
    
    // Setup sidebar
    function setupSidebar() {
      const toggle = document.querySelector('.admin-sidebar-toggle');
      const sidebar = document.querySelector('.admin-sidebar');
      const overlay = document.querySelector('.admin-overlay');
      
      toggle?.addEventListener('click', () => {
        sidebar?.classList.add('active');
        overlay?.classList.add('active');
      });
      
      overlay?.addEventListener('click', () => {
        sidebar?.classList.remove('active');
        overlay?.classList.remove('active');
      });
    }
    
    // Load categories into select
    function loadCategories() {
      subscribe('categories', (categories) => {
        const select = document.getElementById('product-category');
        if (select) {
          const currentValue = select.value;
          select.innerHTML = '<option value="">Select category</option>' +
            categories.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
          select.value = currentValue;
        }
      });
    }
    
    init();
  </script>
</body>
</html>
