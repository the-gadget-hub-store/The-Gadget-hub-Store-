<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Management - Admin - The Gadget Hub Store</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stylesheets - FIXED PATHS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    
    <style>
        .admin-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
        }
        
        .admin-sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 2rem 0;
            position: fixed;
            height: 100vh;
            width: 250px;
            overflow-y: auto;
        }
        
        .admin-logo {
            padding: 0 2rem 2rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }
        
        .admin-logo h2 {
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .admin-logo i {
            color: var(--accent-primary);
        }
        
        .admin-nav {
            display: flex;
            flex-direction: column;
        }
        
        .admin-nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 2rem;
            color: var(--text-secondary);
            transition: all var(--transition-fast);
            cursor: pointer;
            text-decoration: none;
        }
        
        .admin-nav-item:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        
        .admin-nav-item.active {
            background: var(--accent-gradient);
            color: white;
        }
        
        .admin-nav-item i {
            width: 20px;
            text-align: center;
        }
        
        .admin-main {
            margin-left: 250px;
            padding: 2rem;
            background: var(--bg-primary);
            min-height: 100vh;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .admin-header-title h1 {
            margin-bottom: 0.5rem;
        }
        
        .admin-header-title p {
            color: var(--text-secondary);
            margin: 0;
        }
        
        .admin-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .admin-content-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .admin-table-container {
            overflow-x: auto;
        }
        
        .admin-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .admin-table thead {
            background: var(--bg-secondary);
        }
        
        .admin-table th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }
        
        .admin-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        .admin-table tbody tr {
            transition: background var(--transition-fast);
        }
        
        .admin-table tbody tr:hover {
            background: var(--bg-secondary);
        }
        
        .product-thumbnail {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: var(--radius-md);
            background: var(--bg-secondary);
        }
        
        .product-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .product-details h4 {
            margin-bottom: 0.25rem;
            font-size: 0.9375rem;
        }
        
        .product-category {
            font-size: 0.8125rem;
            color: var(--text-muted);
        }
        
        .status-badge {
            padding: 0.375rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .status-active {
            background: rgba(0, 230, 118, 0.1);
            color: var(--success);
        }
        
        .status-draft {
            background: rgba(255, 214, 0, 0.1);
            color: var(--warning);
        }
        
        .status-out-of-stock {
            background: rgba(255, 61, 113, 0.1);
            color: var(--danger);
        }
        
        .admin-table-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .btn-icon:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
            border-color: var(--accent-primary);
        }
        
        .btn-icon.btn-danger:hover {
            background: var(--danger);
            border-color: var(--danger);
            color: white;
        }
        
        .search-filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .search-input-wrapper {
            position: relative;
            flex: 1;
            min-width: 250px;
        }
        
        .search-input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        
        .search-input-wrapper input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 3rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.9375rem;
        }
        
        .filter-select {
            padding: 0.75rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            cursor: pointer;
            min-width: 150px;
        }
        
        .empty-state-admin {
            text-align: center;
            padding: 4rem 2rem;
        }
        
        .empty-state-admin i {
            font-size: 4rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }
        
        .empty-state-admin h3 {
            margin-bottom: 1rem;
        }
        
        .empty-state-admin p {
            color: var(--text-secondary);
            max-width: 400px;
            margin: 0 auto 2rem;
        }
        
        @media (max-width: 991px) {
            .admin-container {
                grid-template-columns: 1fr;
            }
            
            .admin-sidebar {
                position: static;
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            
            .admin-main {
                margin-left: 0;
            }
            
            .admin-table-container {
                overflow-x: scroll;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <h2>
                    <i class="fas fa-shield-alt"></i>
                    Admin Panel
                </h2>
            </div>
            <nav class="admin-nav">
                <a href="index.html" class="admin-nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="products.html" class="admin-nav-item active">
                    <i class="fas fa-box"></i>
                    <span>Products</span>
                </a>
                <a href="categories.html" class="admin-nav-item">
                    <i class="fas fa-th"></i>
                    <span>Categories</span>
                </a>
                <a href="settings.html" class="admin-nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
                <a href="../index.html" class="admin-nav-item">
                    <i class="fas fa-home"></i>
                    <span>View Website</span>
                </a>
                <div class="admin-nav-item" onclick="signOut()" style="margin-top: auto; border-top: 1px solid var(--border);">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Sign Out</span>
                </div>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="admin-main">
            <div class="admin-header">
                <div class="admin-header-title">
                    <h1>Products Management</h1>
                    <p>Manage your product catalog</p>
                </div>
                <div class="admin-actions">
                    <button class="btn btn-primary" onclick="showAddProductForm()">
                        <i class="fas fa-plus"></i>
                        <span>Add New Product</span>
                    </button>
                </div>
            </div>
            
            <!-- Search and Filters -->
            <div class="search-filter-bar">
                <div class="search-input-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="productSearch" placeholder="Search products..." onkeyup="filterProducts()">
                </div>
                <select class="filter-select" id="categoryFilter" onchange="filterProducts()">
                    <option value="">All Categories</option>
                </select>
                <select class="filter-select" id="statusFilter" onchange="filterProducts()">
                    <option value="">All Status</option>
                    <option value="in-stock">In Stock</option>
                    <option value="out-of-stock">Out of Stock</option>
                </select>
            </div>
            
            <!-- Products Table -->
            <div class="admin-content-card">
                <div class="admin-table-container">
                    <table class="admin-table" id="productsTable">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Discount</th>
                                <th>Status</th>
                                <th>Featured</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <tr>
                                <td colspan="7" style="text-align: center; padding: 3rem;">
                                    <p style="color: var(--text-secondary);">Loading products...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <!-- Application Scripts - FIXED PATHS -->
    <script src="../js/firebase.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/categories.js"></script>
    <script src="../js/admin.js"></script>
    
    <script>
        let allProducts = [];
        let allCategories = [];
        
        // Initialize products page
        async function initProductsPage() {
            try {
                console.log('Initializing products page...');
                
                // Load categories for filter
                await loadCategoriesForFilter();
                
                // Load all products
                await loadAllProducts();
                
                console.log('Products page initialized successfully');
            } catch (error) {
                console.error('Error initializing products page:', error);
                showToast('Error loading products page', 'error');
            }
        }
        
        // Load all products
        async function loadAllProducts() {
            try {
                allProducts = await getProducts();
                displayProducts(allProducts);
            } catch (error) {
                console.error('Error loading products:', error);
                showToast('Failed to load products', 'error');
                
                const tbody = document.getElementById('productsTableBody');
                if (tbody) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 3rem;">
                                <p style="color: var(--text-secondary);">Error loading products. Please refresh the page.</p>
                            </td>
                        </tr>
                    `;
                }
            }
        }
        
        // Load categories for filter
        async function loadCategoriesForFilter() {
            try {
                allCategories = await getCategories();
                const categoryFilter = document.getElementById('categoryFilter');
                
                if (categoryFilter) {
                    categoryFilter.innerHTML = '<option value="">All Categories</option>' +
                        allCategories.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
                }
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }
        
        // Display products in table
        function displayProducts(products) {
            const tbody = document.getElementById('productsTableBody');
            
            if (!tbody) {
                console.error('Products table body not found');
                return;
            }
            
            if (products.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7">
                            <div class="empty-state-admin">
                                <i class="fas fa-box-open"></i>
                                <h3>No Products Found</h3>
                                <p>Start by adding your first product to the catalog.</p>
                                <button class="btn btn-primary" onclick="showAddProductForm()">
                                    <i class="fas fa-plus"></i>
                                    <span>Add Product</span>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = products.map(product => {
                const category = allCategories.find(c => c.id === product.category);
                const discount = product.originalPrice ? calculateDiscount(product.originalPrice, product.price) : 0;
                const statusClass = product.stockStatus === 'in-stock' ? 'status-active' : 'status-out-of-stock';
                const statusText = product.stockStatus === 'in-stock' ? 'In Stock' : 'Out of Stock';
                
                return `
                    <tr>
                        <td>
                            <div class="product-info">
                                <img src="${product.thumbnail || product.images[0] || '../assets/images/placeholder.jpg'}" 
                                     alt="${product.title}" 
                                     class="product-thumbnail"
                                     onerror="this.src='../assets/images/placeholder.jpg'">
                                <div class="product-details">
                                    <h4>${truncateText(product.title, 40)}</h4>
                                    <p class="product-category">${category ? category.name : 'Uncategorized'}</p>
                                </div>
                            </div>
                        </td>
                        <td>${category ? category.name : '-'}</td>
                        <td>
                            <strong>${formatPrice(product.price)}</strong>
                            ${product.originalPrice ? `<br><small style="color: var(--text-muted); text-decoration: line-through;">${formatPrice(product.originalPrice)}</small>` : ''}
                        </td>
                        <td>${discount > 0 ? `<span class="status-badge" style="background: rgba(255, 61, 113, 0.1); color: var(--danger);">${discount}% OFF</span>` : '-'}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>
                            ${product.featured ? '<i class="fas fa-star" style="color: var(--warning);"></i>' : ''}
                            ${product.trending ? '<i class="fas fa-fire" style="color: var(--danger);"></i>' : ''}
                            ${product.bestseller ? '<i class="fas fa-trophy" style="color: var(--accent-primary);"></i>' : ''}
                            ${product.newArrival ? '<i class="fas fa-sparkles" style="color: var(--success);"></i>' : ''}
                        </td>
                        <td>
                            <div class="admin-table-actions">
                                <button class="btn-icon" onclick="viewProduct('${product.id}')" title="View">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn-icon" onclick="editProductModal('${product.id}')" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn-icon btn-danger" onclick="deleteProductConfirm('${product.id}')" title="Delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        // Filter products
        function filterProducts() {
            const searchTerm = document.getElementById('productSearch').value.toLowerCase();
            const categoryFilter = document.getElementById('categoryFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            
            let filtered = allProducts.filter(product => {
                const matchesSearch = product.title.toLowerCase().includes(searchTerm) ||
                                    (product.description && product.description.toLowerCase().includes(searchTerm));
                const matchesCategory = !categoryFilter || product.category === categoryFilter;
                const matchesStatus = !statusFilter || product.stockStatus === statusFilter;
                
                return matchesSearch && matchesCategory && matchesStatus;
            });
            
            displayProducts(filtered);
        }
        
        // View product
        function viewProduct(productId) {
            window.open(`../pages/product.html?id=${productId}`, '_blank');
        }
        
        // Edit product modal
        async function editProductModal(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product) {
                showToast('Product not found', 'error');
                return;
            }
            
            // For now, just show a toast - full edit form can be implemented later
            showToast('Edit feature coming soon. Product ID: ' + productId, 'info');
            
            // TODO: Implement full edit modal similar to add product
        }
        
        // Make functions globally accessible
        window.initProductsPage = initProductsPage;
        window.loadAllProducts = loadAllProducts;
        window.filterProducts = filterProducts;
        window.viewProduct = viewProduct;
        window.editProductModal = editProductModal;
        
        // Initialize page when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initProductsPage);
        } else {
            initProductsPage();
        }
    </script>
</body>
</html>
