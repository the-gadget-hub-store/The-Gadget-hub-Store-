<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage Products - The Gadget Hub Store Admin">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    
    <title>Manage Products - Admin - The Gadget Hub Store</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    
    <style>
        .admin-table { width: 100%; border-collapse: collapse; margin-top: var(--spacing-lg); background: var(--color-bg-glass); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
        .admin-table th, .admin-table td { padding: var(--spacing-md); text-align: left; border-bottom: 1px solid var(--color-border); }
        .admin-table th { background: var(--color-bg-elevated); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); }
        .admin-table tr:last-child td { border-bottom: none; }
        .admin-table tbody tr:hover { background: var(--color-bg-elevated); }
        .admin-actions { display: flex; gap: var(--spacing-xs); }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--color-overlay); backdrop-filter: blur(var(--blur-sm)); display: none; align-items: center; justify-content: center; z-index: var(--z-modal); }
        .modal.active { display: flex; }
        .modal-content { background: var(--color-bg-glass); backdrop-filter: blur(var(--blur-lg)); border: 1px solid var(--color-border); border-radius: var(--radius-xl); max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; padding: var(--spacing-xl); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg); }
        .modal-close { background: none; border: none; color: var(--color-text-tertiary); cursor: pointer; padding: var(--spacing-xs); }
        .form-group { margin-bottom: var(--spacing-md); }
        .form-label { display: block; margin-bottom: var(--spacing-xs); font-weight: var(--font-weight-medium); color: var(--color-text-primary); }
        .form-input, .form-textarea, .form-select { width: 100%; padding: var(--spacing-sm); background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-md); color: var(--color-text-primary); font-family: var(--font-family); font-size: 0.9375rem; }
        .form-textarea { min-height: 100px; resize: vertical; }
        .form-checkbox { display: flex; align-items: center; gap: var(--spacing-sm); }
        .form-checkbox input { width: auto; }
    </style>
</head>
<body>
    
    <nav class="nav" id="mainNav">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="../index.html" class="logo">THE GADGET HUB STORE ADMIN</a>
            </div>
            
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Dashboard</a></li>
                <li><a href="products.html" class="nav-link active" aria-current="page">Products</a></li>
                <li><a href="categories.html" class="nav-link">Categories</a></li>
                <li><a href="settings.html" class="nav-link">Settings</a></li>
            </ul>
            
            <div class="nav-actions">
                <a href="../index.html" class="nav-icon-btn" aria-label="View Store">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    </svg>
                </a>
                
                <button class="nav-icon-btn theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </div>
    </nav>
    
    <main class="container" style="padding-top: var(--spacing-2xl); padding-bottom: var(--spacing-3xl);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-xl);">
            <h1>Manage Products</h1>
            <button class="btn btn-primary" id="addProductBtn">Add Product</button>
        </div>
        
        <div id="productsTableContainer">
            <div class="products-loading"><div class="spinner"></div><p>Loading products...</p></div>
        </div>
    </main>
    
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Product</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label class="form-label">Title *</label>
                    <input type="text" class="form-input" id="productTitle" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea class="form-textarea" id="productDescription"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Category *</label>
                    <select class="form-select" id="productCategory" required></select>
                </div>
                <div class="form-group">
                    <label class="form-label">Base Price (USD) *</label>
                    <input type="number" class="form-input" id="productBasePrice" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Original Price (USD)</label>
                    <input type="number" class="form-input" id="productOriginalPrice" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label class="form-label">Discount (%)</label>
                    <input type="number" class="form-input" id="productDiscount" min="0" max="100">
                </div>
                <div class="form-group">
                    <label class="form-label">AliExpress Affiliate URL</label>
                    <input type="url" class="form-input" id="productAffiliateUrl">
                </div>
                <div class="form-group">
                    <label class="form-label">Image URL</label>
                    <input type="url" class="form-input" id="productImage">
                </div>
                <div class="form-group">
                    <label class="form-checkbox">
                        <input type="checkbox" id="productFeatured">
                        <span>Featured</span>
                    </label>
                </div>
                <div class="form-group">
                    <label class="form-checkbox">
                        <input type="checkbox" id="productTrending">
                        <span>Trending</span>
                    </label>
                </div>
                <div style="display: flex; gap: var(--spacing-md); justify-content: flex-end; margin-top: var(--spacing-xl);">
                    <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveProductBtn">
                        <span class="btn-text">Save Product</span>
                        <span class="btn-loading"><span class="spinner-small"></span></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>
    
    <script type="module" src="../js/firebase.js"></script>
    <script type="module" src="../js/ui.js"></script>
    <script type="module">
        import { loadAdminProducts, createProduct, updateProduct, deleteProduct, loadAdminCategories } from '../js/admin.js';
        import { showToast, setButtonLoading, escapeHtml } from '../js/ui.js';
        
        let products = [];
        let categories = [];
        let editingProductId = null;
        
        async function init() {
            await loadProducts();
            await loadCategories();
            setupEventListeners();
        }
        
        async function loadProducts() {
            try {
                products = await loadAdminProducts();
                renderProductsTable();
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('productsTableContainer').innerHTML = '<p style="color: var(--color-error);">Failed to load products</p>';
            }
        }
        
        async function loadCategories() {
            try {
                categories = await loadAdminCategories();
                populateCategorySelect();
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }
        
        function populateCategorySelect() {
            const select = document.getElementById('productCategory');
            select.innerHTML = '<option value="">Select a category</option>' + 
                categories.map(cat => `<option value="${cat.id}">${escapeHtml(cat.name)}</option>`).join('');
        }
        
        function renderProductsTable() {
            const container = document.getElementById('productsTableContainer');
            if (products.length === 0) {
                container.innerHTML = '<p style="text-align: center; padding: var(--spacing-2xl); color: var(--color-text-tertiary);">No products yet. Add your first product!</p>';
                return;
            }
            
            container.innerHTML = `
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Featured</th>
                            <th>Trending</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${products.map(p => `
                            <tr>
                                <td>${escapeHtml(p.title || 'Untitled')}</td>
                                <td>${escapeHtml(p.category || 'N/A')}</td>
                                <td>$${(p.basePrice || 0).toFixed(2)}</td>
                                <td>${p.featured ? '✓' : '–'}</td>
                                <td>${p.trending ? '✓' : '–'}</td>
                                <td class="admin-actions">
                                    <button class="btn btn-outline btn-sm" onclick="window.editProduct('${p.id}')">Edit</button>
                                    <button class="btn btn-outline btn-sm" onclick="window.deleteProductConfirm('${p.id}')">Delete</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        function setupEventListeners() {
            document.getElementById('addProductBtn').addEventListener('click', openAddModal);
            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('cancelBtn').addEventListener('click', closeModal);
            document.getElementById('productForm').addEventListener('submit', handleSubmit);
        }
        
        function openAddModal() {
            editingProductId = null;
            document.getElementById('modalTitle').textContent = 'Add Product';
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('productModal').classList.add('active');
        }
        
        window.editProduct = function(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            editingProductId = productId;
            document.getElementById('modalTitle').textContent = 'Edit Product';
            document.getElementById('productId').value = productId;
            document.getElementById('productTitle').value = product.title || '';
            document.getElementById('productDescription').value = product.description || '';
            document.getElementById('productCategory').value = product.categoryId || '';
            document.getElementById('productBasePrice').value = product.basePrice || '';
            document.getElementById('productOriginalPrice').value = product.originalPrice || '';
            document.getElementById('productDiscount').value = product.discount || '';
            document.getElementById('productAffiliateUrl').value = product.affiliateUrl || '';
            document.getElementById('productImage').value = product.thumbnail || '';
            document.getElementById('productFeatured').checked = product.featured || false;
            document.getElementById('productTrending').checked = product.trending || false;
            document.getElementById('productModal').classList.add('active');
        };
        
        window.deleteProductConfirm = async function(productId) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            
            try {
                await deleteProduct(productId);
                showToast('Product deleted successfully', 'success');
                await loadProducts();
            } catch (error) {
                showToast('Failed to delete product', 'error');
            }
        };
        
        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
        }
        
        async function handleSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('saveProductBtn');
            setButtonLoading(btn, true);
            
            const categoryId = document.getElementById('productCategory').value;
            const category = categories.find(c => c.id === categoryId);
            
            const productData = {
                title: document.getElementById('productTitle').value,
                description: document.getElementById('productDescription').value,
                category: category?.name || '',
                categoryId: categoryId,
                basePrice: parseFloat(document.getElementById('productBasePrice').value),
                originalPrice: parseFloat(document.getElementById('productOriginalPrice').value) || null,
                discount: parseInt(document.getElementById('productDiscount').value) || 0,
                affiliateUrl: document.getElementById('productAffiliateUrl').value,
                thumbnail: document.getElementById('productImage').value,
                images: document.getElementById('productImage').value ? [document.getElementById('productImage').value] : [],
                featured: document.getElementById('productFeatured').checked,
                trending: document.getElementById('productTrending').checked,
                rating: 0,
                reviewCount: 0
            };
            
            try {
                if (editingProductId) {
                    await updateProduct(editingProductId, productData);
                    showToast('Product updated successfully', 'success');
                } else {
                    await createProduct(productData);
                    showToast('Product created successfully', 'success');
                }
                closeModal();
                await loadProducts();
            } catch (error) {
                showToast('Failed to save product', 'error');
            } finally {
                setButtonLoading(btn, false);
            }
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
