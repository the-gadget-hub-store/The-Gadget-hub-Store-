<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Best deals on tech gadgets and accessories. Limited time offers and exclusive discounts.">
    <title>Today's Deals - The Gadget Hub Store</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/responsive.css">
    
    <style>
        .deals-header {
            padding: 8rem 0 3rem;
            text-align: center;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--surface) 100%);
            position: relative;
            overflow: hidden;
        }
        
        .deals-header::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 61, 113, 0.1) 0%, transparent 70%);
            animation: pulse 4s ease infinite;
        }
        
        .deals-badge-large {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: var(--danger);
            color: white;
            font-size: 1.125rem;
            font-weight: 600;
            border-radius: var(--radius-full);
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 24px rgba(255, 61, 113, 0.3);
        }
        
        .deals-badge-large i {
            font-size: 1.5rem;
            animation: bounce 1s ease infinite;
        }
        
        .deals-filter {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }
        
        .deals-filter-btn {
            padding: 0.75rem 1.5rem;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius-full);
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .deals-filter-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        
        .deals-filter-btn.active {
            background: var(--accent-gradient);
            border-color: transparent;
            color: white;
        }
        
        .deal-highlight {
            position: relative;
            overflow: hidden;
        }
        
        .deal-highlight::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="/" class="logo-link">
                    <i class="fas fa-cube logo-icon"></i>
                    <span class="logo-text">The Gadget Hub Store</span>
                </a>
            </div>
            
            <div class="nav-menu" id="navMenu">
                <a href="/" class="nav-link">Home</a>
                <a href="/pages/shop.html" class="nav-link">Shop</a>
                <a href="/pages/categories.html" class="nav-link">Categories</a>
                <a href="/pages/trending.html" class="nav-link">Trending</a>
                <a href="/pages/deals.html" class="nav-link active">Deals</a>
                <a href="#about" class="nav-link">About</a>
            </div>
            
            <div class="nav-actions">
                <button class="nav-icon-btn" id="searchBtn" aria-label="Search">
                    <i class="fas fa-search"></i>
                </button>
                <button class="nav-icon-btn" id="favoritesBtn" aria-label="Favorites">
                    <i class="far fa-heart"></i>
                    <span class="badge" id="favoritesCount">0</span>
                </button>
                <button class="nav-icon-btn" id="accountBtn" aria-label="Account">
                    <i class="far fa-user"></i>
                </button>
                <a href="https://s.click.aliexpress.com/e/_c3hTwqib" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="nav-cta-btn">
                    <i class="fas fa-shopping-bag"></i>
                    <span>Visit AliExpress Store</span>
                </a>
                <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </nav>
    
    <!-- Mobile Drawer -->
    <div class="mobile-drawer" id="mobileDrawer">
        <!-- Same as index.html -->
    </div>
    
    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
        <!-- Same as index.html -->
    </div>
    
    <!-- Deals Header -->
    <section class="deals-header">
        <div class="container">
            <div class="deals-badge-large">
                <i class="fas fa-tags"></i>
                <span>Limited Time Offers</span>
            </div>
            <h1>Today's Best Deals</h1>
            <p>Exclusive discounts on premium tech gadgets - Don't miss out!</p>
        </div>
    </section>
    
    <!-- Deals Content -->
    <section class="section">
        <div class="container">
            <!-- Deals Filter -->
            <div class="deals-filter">
                <button class="deals-filter-btn active" data-filter="all" onclick="filterDeals('all')">
                    All Deals
                </button>
                <button class="deals-filter-btn" data-filter="50" onclick="filterDeals('50')">
                    50% Off & More
                </button>
                <button class="deals-filter-btn" data-filter="40" onclick="filterDeals('40')">
                    40% Off & More
                </button>
                <button class="deals-filter-btn" data-filter="30" onclick="filterDeals('30')">
                    30% Off & More
                </button>
            </div>
            
            <div class="shop-toolbar">
                <div class="products-count" id="dealsCount">
                    Loading...
                </div>
                <select class="sort-select" id="sortSelect" onchange="sortDeals()">
                    <option value="discount">Biggest Discount</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                    <option value="rating">Highest Rated</option>
                    <option value="popular">Most Popular</option>
                </select>
            </div>
            
            <div class="products-grid" id="dealsProductsGrid">
                <!-- Products loaded dynamically -->
                <div class="product-skeleton"></div>
                <div class="product-skeleton"></div>
                <div class="product-skeleton"></div>
                <div class="product-skeleton"></div>
            </div>
        </div>
    </section>
    
    <!-- Footer -->
    <footer class="footer" id="footer">
        <!-- Same as index.html -->
    </footer>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>
    
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader">
            <div class="loader-cube"></div>
            <div class="loader-cube"></div>
            <div class="loader-cube"></div>
            <div class="loader-cube"></div>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <!-- Application Scripts -->
    <script src="/js/firebase.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/products.js"></script>
    <script src="/js/favorites.js"></script>
    <script src="/js/search.js"></script>
    <script src="/js/categories.js"></script>
    <script src="/js/app.js"></script>
    
    <script>
        let allDeals = [];
        let filteredDeals = [];
        let activeDiscountFilter = 'all';
        
        async function loadDealsPage() {
            try {
                showLoading();
                
                // Get all products
                const products = await getProducts();
                
                // Filter products with discounts
                allDeals = products.filter(p => p.originalPrice && p.originalPrice > p.price);
                
                // Sort by discount initially
                allDeals = sortProducts(allDeals, 'discount');
                
                filteredDeals = [...allDeals];
                displayDeals();
                
                hideLoading();
            } catch (error) {
                console.error('Error loading deals page:', error);
                showToast('Failed to load deals', 'error');
                hideLoading();
            }
        }
        
        function filterDeals(minDiscount) {
            activeDiscountFilter = minDiscount;
            
            // Update active button
            document.querySelectorAll('.deals-filter-btn').forEach(btn => {
                if (btn.dataset.filter === minDiscount) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // Filter products
            if (minDiscount === 'all') {
                filteredDeals = [...allDeals];
            } else {
                const minDiscountPercent = parseInt(minDiscount);
                filteredDeals = allDeals.filter(p => {
                    const discount = calculateDiscount(p.originalPrice, p.price);
                    return discount >= minDiscountPercent;
                });
            }
            
            displayDeals();
        }
        
        function displayDeals() {
            const container = document.getElementById('dealsProductsGrid');
            const countElement = document.getElementById('dealsCount');
            
            if (countElement) {
                countElement.textContent = `${filteredDeals.length} deals available`;
            }
            
            renderProducts(container, filteredDeals);
        }
        
        function sortDeals() {
            const sortBy = document.getElementById('sortSelect').value;
            filteredDeals = sortProducts(filteredDeals, sortBy);
            displayDeals();
        }
        
        loadDealsPage();
    </script>
</body>
</html>
