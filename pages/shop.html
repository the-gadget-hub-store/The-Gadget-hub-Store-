<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shop the latest gadgets and tech products. Browse our collection of innovative electronics and accessories.">
    <title>Shop - The Gadget Hub Store</title>
    
    <link rel="canonical" href="https://gadgethubstore.com/pages/shop.html">
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/responsive.css">
    
    <style>
        /* Shop Page Specific Styles */
        .shop-header {
            padding: 8rem 0 3rem;
            text-align: center;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--surface) 100%);
        }
        
        .shop-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .shop-sidebar {
            position: sticky;
            top: 100px;
            height: fit-content;
        }
        
        .filter-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .filter-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .filter-options {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .filter-option {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: color var(--transition-fast);
        }
        
        .filter-option:hover {
            color: var(--accent-primary);
        }
        
        .filter-option input[type="checkbox"],
        .filter-option input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .price-range {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }
        
        .price-input {
            flex: 1;
            padding: 0.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
        }
        
        .shop-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            margin-bottom: 2rem;
        }
        
        .products-count {
            color: var(--text-secondary);
        }
        
        .toolbar-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .sort-select {
            padding: 0.625rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            cursor: pointer;
        }
        
        .view-toggle {
            display: flex;
            gap: 0.5rem;
        }
        
        .view-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .view-btn.active,
        .view-btn:hover {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: white;
        }
        
        .mobile-filter-btn {
            display: none;
            width: 100%;
            margin-bottom: 1rem;
        }
        
        @media (max-width: 991px) {
            .shop-container {
                grid-template-columns: 1fr;
            }
            
            .shop-sidebar {
                position: fixed;
                top: 0;
                left: 0;
                width: 85%;
                max-width: 350px;
                height: 100vh;
                background: var(--bg-secondary);
                transform: translateX(-100%);
                transition: transform var(--transition-base);
                z-index: var(--z-modal);
                overflow-y: auto;
                padding: 2rem;
            }
            
            .shop-sidebar.active {
                transform: translateX(0);
            }
            
            .mobile-filter-btn {
                display: flex;
            }
            
            .filter-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                background: rgba(0, 0, 0, 0.7);
                z-index: calc(var(--z-modal) - 1);
                opacity: 0;
                pointer-events: none;
                transition: opacity var(--transition-base);
            }
            
            .filter-overlay.active {
                opacity: 1;
                pointer-events: all;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation (same as index.html) -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="/" class="logo-link">
                    <i class="fas fa-cube logo-icon"></i>
                    <span class="logo-text">The Gadget Hub Store</span>
                </a>
            </div>
            
            <div class="nav-menu" id="navMenu">
                <a href="/" class="nav-link">Home</a>
                <a href="/pages/shop.html" class="nav-link active">Shop</a>
                <a href="/pages/categories.html" class="nav-link">Categories</a>
                <a href="/pages/trending.html" class="nav-link">Trending</a>
                <a href="/pages/deals.html" class="nav-link">Deals</a>
                <a href="#about" class="nav-link">About</a>
            </div>
            
            <div class="nav-actions">
                <button class="nav-icon-btn" id="searchBtn" aria-label="Search">
                    <i class="fas fa-search"></i>
                </button>
                <button class="nav-icon-btn" id="favoritesBtn" aria-label="Favorites">
                    <i class="far fa-heart"></i>
                    <span class="badge" id="favoritesCount">0</span>
                </button>
                <button class="nav-icon-btn" id="accountBtn" aria-label="Account">
                    <i class="far fa-user"></i>
                </button>
                <a href="https://s.click.aliexpress.com/e/_c3hTwqib" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="nav-cta-btn">
                    <i class="fas fa-shopping-bag"></i>
                    <span>Visit AliExpress Store</span>
                </a>
                <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </nav>
    
    <!-- Mobile Drawer (same as index.html) -->
    <div class="mobile-drawer" id="mobileDrawer">
        <!-- Same content as index.html -->
    </div>
    
    <!-- Search Overlay (same as index.html) -->
    <div class="search-overlay" id="searchOverlay">
        <!-- Same content as index.html -->
    </div>
    
    <!-- Shop Header -->
    <section class="shop-header">
        <div class="container">
            <h1>Shop All Products</h1>
            <p>Discover our complete collection of innovative gadgets and tech products</p>
        </div>
    </section>
    
    <!-- Shop Content -->
    <section class="section">
        <div class="container">
            <!-- Mobile Filter Button -->
            <button class="btn btn-outline mobile-filter-btn" id="mobileFilterBtn">
                <i class="fas fa-filter"></i>
                <span>Filters</span>
            </button>
            
            <!-- Filter Overlay -->
            <div class="filter-overlay" id="filterOverlay"></div>
            
            <div class="shop-container">
                <!-- Sidebar Filters -->
                <aside class="shop-sidebar" id="shopSidebar">
                    <div class="filter-section">
                        <h3 class="filter-title">
                            <span>Categories</span>
                        </h3>
                        <div class="filter-options" id="categoryFilters">
                            <!-- Categories loaded dynamically -->
                        </div>
                    </div>
                    
                    <div class="filter-section">
                        <h3 class="filter-title">
                            <span>Price Range</span>
                        </h3>
                        <div class="price-range">
                            <input type="number" class="price-input" id="minPrice" placeholder="Min" min="0">
                            <span>-</span>
                            <input type="number" class="price-input" id="maxPrice" placeholder="Max" min="0">
                        </div>
                        <button class="btn btn-primary btn-small" style="width: 100%; margin-top: 1rem;" onclick="applyPriceFilter()">
                            Apply
                        </button>
                    </div>
                    
                    <div class="filter-section">
                        <h3 class="filter-title">
                            <span>Rating</span>
                        </h3>
                        <div class="filter-options">
                            <label class="filter-option">
                                <input type="radio" name="rating" value="4" onchange="applyFilters()">
                                <span>
                                    <div class="stars">${generateStarRating(4)}</div>
                                    & Up
                                </span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="rating" value="3" onchange="applyFilters()">
                                <span>
                                    <div class="stars">${generateStarRating(3)}</div>
                                    & Up
                                </span>
                            </label>
                        </div>
                    </div>
                    
                    <div class="filter-section">
                        <h3 class="filter-title">
                            <span>Availability</span>
                        </h3>
                        <div class="filter-options">
                            <label class="filter-option">
                                <input type="checkbox" id="inStockOnly" onchange="applyFilters()">
                                <span>In Stock Only</span>
                            </label>
                        </div>
                    </div>
                    
                    <button class="btn btn-outline" style="width: 100%;" onclick="clearFilters()">
                        <i class="fas fa-redo"></i>
                        <span>Clear Filters</span>
                    </button>
                </aside>
                
                <!-- Products Area -->
                <div class="shop-main">
                    <!-- Toolbar -->
                    <div class="shop-toolbar">
                        <div class="products-count" id="productsCount">
                            Loading products...
                        </div>
                        
                        <div class="toolbar-actions">
                            <select class="sort-select" id="sortSelect" onchange="applySorting()">
                                <option value="featured">Featured</option>
                                <option value="newest">Newest</option>
                                <option value="price-low">Price: Low to High</option>
                                <option value="price-high">Price: High to Low</option>
                                <option value="rating">Highest Rated</option>
                                <option value="popular">Most Popular</option>
                                <option value="discount">Biggest Discount</option>
                            </select>
                            
                            <div class="view-toggle">
                                <button class="view-btn active" data-view="grid">
                                    <i class="fas fa-th"></i>
                                </button>
                                <button class="view-btn" data-view="list">
                                    <i class="fas fa-list"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Products Grid -->
                    <div class="products-grid" id="shopProductsGrid">
                        <!-- Products loaded dynamically -->
                        <div class="product-skeleton"></div>
                        <div class="product-skeleton"></div>
                        <div class="product-skeleton"></div>
                        <div class="product-skeleton"></div>
                    </div>
                    
                    <!-- Pagination (if needed) -->
                    <div class="pagination" id="pagination" style="display: none;">
                        <!-- Pagination buttons -->
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <!-- Footer (same as index.html) -->
    <footer class="footer" id="footer">
        <!-- Same content as index.html -->
    </footer>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>
    
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader">
            <div class="loader-cube"></div>
            <div class="loader-cube"></div>
            <div class="loader-cube"></div>
            <div class="loader-cube"></div>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <!-- Application Scripts -->
    <script src="/js/firebase.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/products.js"></script>
    <script src="/js/favorites.js"></script>
    <script src="/js/search.js"></script>
    <script src="/js/categories.js"></script>
    <script src="/js/app.js"></script>
    
    <script>
        // Shop Page Logic
        let allProducts = [];
        let filteredProducts = [];
        let activeFilters = {
            category: null,
            minPrice: null,
            maxPrice: null,
            minRating: null,
            inStockOnly: false
        };
        
        // Load shop page
        async function loadShopPage() {
            try {
                showLoading();
                
                // Load products
                allProducts = await getProducts();
                filteredProducts = [...allProducts];
                
                // Check for URL parameters
                const categoryParam = getURLParameter('category');
                const searchParam = getURLParameter('search');
                
                if (categoryParam) {
                    activeFilters.category = categoryParam;
                }
                
                if (searchParam) {
                    filteredProducts = await searchProducts(searchParam);
                }
                
                // Load category filters
                loadCategoryFilters();
                
                // Apply filters and display
                applyFilters();
                
                // Initialize mobile filter
                initMobileFilter();
                
                hideLoading();
            } catch (error) {
                console.error('Error loading shop page:', error);
                showToast('Failed to load products', 'error');
                hideLoading();
            }
        }
        
        // Load category filters
        async function loadCategoryFilters() {
            const container = document.getElementById('categoryFilters');
            if (!container) return;
            
            const categories = await getCategories();
            
            container.innerHTML = `
                <label class="filter-option">
                    <input type="radio" name="category" value="" ${!activeFilters.category ? 'checked' : ''} onchange="applyFilters()">
                    <span>All Categories</span>
                </label>
                ${categories.map(cat => `
                    <label class="filter-option">
                        <input type="radio" name="category" value="${cat.id}" ${activeFilters.category === cat.id ? 'checked' : ''} onchange="applyFilters()">
                        <span>${cat.name}</span>
                    </label>
                `).join('')}
            `;
        }
        
        // Apply filters
        function applyFilters() {
            // Get filter values
            const categoryRadios = document.getElementsByName('category');
            const selectedCategory = Array.from(categoryRadios).find(r => r.checked)?.value;
            activeFilters.category = selectedCategory || null;
            
            const ratingRadios = document.getElementsByName('rating');
            const selectedRating = Array.from(ratingRadios).find(r => r.checked)?.value;
            activeFilters.minRating = selectedRating ? parseFloat(selectedRating) : null;
            
            activeFilters.inStockOnly = document.getElementById('inStockOnly')?.checked || false;
            
            // Filter products
            filteredProducts = filterProducts(allProducts, activeFilters);
            
            // Apply sorting
            applySorting();
        }
        
        // Apply price filter
        function applyPriceFilter() {
            const minPrice = document.getElementById('minPrice')?.value;
            const maxPrice = document.getElementById('maxPrice')?.value;
            
            activeFilters.minPrice = minPrice ? parseFloat(minPrice) : null;
            activeFilters.maxPrice = maxPrice ? parseFloat(maxPrice) : null;
            
            applyFilters();
        }
        
        // Apply sorting
        function applySorting() {
            const sortBy = document.getElementById('sortSelect')?.value || 'featured';
            filteredProducts = sortProducts(filteredProducts, sortBy);
            displayProducts();
        }
        
        // Display products
        function displayProducts() {
            const container = document.getElementById('shopProductsGrid');
            const countElement = document.getElementById('productsCount');
            
            if (countElement) {
                countElement.textContent = `${filteredProducts.length} products found`;
            }
            
            renderProducts(container, filteredProducts);
        }
        
        // Clear filters
        function clearFilters() {
            activeFilters = {
                category: null,
                minPrice: null,
                maxPrice: null,
                minRating: null,
                inStockOnly: false
            };
            
            // Reset form inputs
            document.querySelectorAll('input[type="radio"]').forEach(input => input.checked = false);
            document.querySelectorAll('input[type="checkbox"]').forEach(input => input.checked = false);
            document.getElementById('minPrice').value = '';
            document.getElementById('maxPrice').value = '';
            
            // Check "All Categories"
            const allCategoriesRadio = document.querySelector('input[name="category"][value=""]');
            if (allCategoriesRadio) allCategoriesRadio.checked = true;
            
            filteredProducts = [...allProducts];
            displayProducts();
        }
        
        // Initialize mobile filter
        function initMobileFilter() {
            const mobileFilterBtn = document.getElementById('mobileFilterBtn');
            const sidebar = document.getElementById('shopSidebar');
            const overlay = document.getElementById('filterOverlay');
            
            if (mobileFilterBtn && sidebar && overlay) {
                mobileFilterBtn.addEventListener('click', () => {
                    sidebar.classList.add('active');
                    overlay.classList.add('active');
                });
                
                overlay.addEventListener('click', () => {
                    sidebar.classList.remove('active');
                    overlay.classList.remove('active');
                });
            }
        }
    </script>
</body>
</html>
