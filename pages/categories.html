<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse all product categories. Find gadgets and tech products organized by category.">
    <title>All Categories - The Gadget Hub Store</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/responsive.css">
    
    <style>
        .categories-page-header {
            padding: 8rem 0 3rem;
            text-align: center;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--surface) 100%);
        }
        
        .category-card-large {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 3rem 2rem;
            text-align: center;
            transition: all var(--transition-base);
            cursor: pointer;
            overflow: hidden;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .category-card-large::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--accent-gradient);
            opacity: 0;
            transition: opacity var(--transition-base);
        }
        
        .category-card-large:hover {
            border-color: var(--accent-primary);
            transform: translateY(-12px);
            box-shadow: var(--shadow-xl);
        }
        
        .category-card-large:hover::before {
            opacity: 0.08;
        }
        
        .category-icon-large {
            width: 100px;
            height: 100px;
            margin: 0 auto 2rem;
            background: var(--accent-gradient);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            transition: all var(--transition-base);
            position: relative;
            z-index: 1;
        }
        
        .category-card-large:hover .category-icon-large {
            transform: scale(1.15) rotate(5deg);
        }
        
        .category-name-large {
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
            position: relative;
            z-index: 1;
        }
        
        .category-description {
            color: var(--text-secondary);
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
        }
        
        .category-count-large {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-primary);
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="/" class="logo-link">
                    <i class="fas fa-cube logo-icon"></i>
                    <span class="logo-text">The Gadget Hub Store</span>
                </a>
            </div>
            
            <div class="nav-menu" id="navMenu">
                <a href="/" class="nav-link">Home</a>
                <a href="/pages/shop.html" class="nav-link">Shop</a>
                <a href="/pages/categories.html" class="nav-link active">Categories</a>
                <a href="/pages/trending.html" class="nav-link">Trending</a>
                <a href="/pages/deals.html" class="nav-link">Deals</a>
                <a href="#about" class="nav-link">About</a>
            </div>
            
            <div class="nav-actions">
                <button class="nav-icon-btn" id="searchBtn" aria-label="Search">
                    <i class="fas fa-search"></i>
                </button>
                <button class="nav-icon-btn" id="favoritesBtn" aria-label="Favorites">
                    <i class="far fa-heart"></i>
                    <span class="badge" id="favoritesCount">0</span>
                </button>
                <button class="nav-icon-btn" id="accountBtn" aria-label="Account">
                    <i class="far fa-user"></i>
                </button>
                <a href="https://s.click.aliexpress.com/e/_c3hTwqib" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="nav-cta-btn">
                    <i class="fas fa-shopping-bag"></i>
                    <span>Visit AliExpress Store</span>
                </a>
                <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </nav>
    
    <!-- Mobile Drawer -->
    <div class="mobile-drawer" id="mobileDrawer">
        <!-- Same as index.html -->
    </div>
    
    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
        <!-- Same as index.html -->
    </div>
    
    <!-- Categories Header -->
    <section class="categories-page-header">
        <div class="container">
            <div class="section-badge">
                <i class="fas fa-th"></i>
                <span>Browse All</span>
            </div>
            <h1>All Categories</h1>
            <p>Explore our complete range of tech product categories</p>
        </div>
    </section>
    
    <!-- Categories Content -->
    <section class="section">
        <div class="container">
            <div class="categories-grid" id="allCategoriesGrid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));">
                <!-- Categories loaded dynamically -->
                <div class="category-skeleton"></div>
                <div class="category-skeleton"></div>
                <div class="category-skeleton"></div>
                <div class="category-skeleton"></div>
            </div>
        </div>
    </section>
    
    <!-- Footer -->
    <footer class="footer" id="footer">
        <!-- Same as index.html -->
    </footer>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>
    
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader">
            <div class="loader-cube"></div>
            <div class="loader-cube"></div>
            <div class="loader-cube"></div>
            <div class="loader-cube"></div>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <!-- Application Scripts -->
    <script src="/js/firebase.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/products.js"></script>
    <script src="/js/favorites.js"></script>
    <script src="/js/search.js"></script>
    <script src="/js/categories.js"></script>
    <script src="/js/app.js"></script>
    
    <script>
        // Override category card creation for larger cards
        function createCategoryCardLarge(category) {
            return `
                <a href="/pages/shop.html?category=${category.id}" class="category-card-large" data-category-id="${category.id}">
                    <div class="category-icon-large">
                        <i class="fas ${category.icon}"></i>
                    </div>
                    <h3 class="category-name-large">${category.name}</h3>
                    <p class="category-description">${category.description}</p>
                    <div class="category-count-large">${formatNumber(category.productCount)} products</div>
                </a>
            `;
        }
        
        // Load all categories
        async function loadAllCategoriesPage() {
            const container = document.getElementById('allCategoriesGrid');
            if (!container) return;
            
            try {
                showLoading();
                const categories = await loadCategories();
                
                container.innerHTML = categories.map(category => createCategoryCardLarge(category)).join('');
                initCategoryCards();
                
                hideLoading();
            } catch (error) {
                console.error('Error loading categories page:', error);
                showToast('Failed to load categories', 'error');
                hideLoading();
            }
        }
        
        loadAllCategoriesPage();
    </script>
</body>
</html>
